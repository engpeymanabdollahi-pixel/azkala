name: CI Pipeline

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo, sqlite, zip, bcmath
          coverage: none

      - name: Verify composer.json exists
        working-directory: backend
        run: |
          echo "📁 Current directory: $(pwd)"
          echo "📋 Files in backend:"
          ls -la
          if [ ! -f composer.json ]; then
            echo "❌ composer.json not found!"
            exit 1
          fi
          echo "✅ composer.json found"

      # ✅ این مرحله در جای صحیح (قبل از composer install) قرار گرفته است
      - name: Setup Bootstrap Cache Directory
        working-directory: backend
        run: |
          echo "🔧 Creating bootstrap/cache directory..."
          mkdir -p bootstrap/cache
          chmod -R 777 bootstrap/cache
          echo "✅ Directory created with full permissions"
          ls -la bootstrap/

      - name: Install Dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Environment
        working-directory: backend
        run: |
          cp .env.example .env || echo "APP_NAME=Azkala" > .env
          php artisan key:generate --force || true

      - name: Run PHPUnit Tests
        working-directory: backend
        run: php vendor/bin/phpunit --testdox

      # Advisory for now: the codebase predates Pint, so ~328 files are
      # unformatted. Reformatting them is a separate, deliberate commit;
      # until then this reports the gap without blocking the build. Flip
      # continue-on-error to false once `composer lint:fix` has been run.
      - name: Check Formatting (Pint) [advisory]
        working-directory: backend
        continue-on-error: true
        run: php vendor/bin/pint --test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify package files exist
        working-directory: frontend
        run: |
          echo "📁 Current directory: $(pwd)"
          echo "📋 Files in frontend:"
          ls -la
          if [ ! -f package.json ]; then
            echo "❌ package.json not found!"
            exit 1
          fi
          echo "✅ package.json found"

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      # Blocking: the ESLint config is tuned so the codebase currently passes
      # with 0 errors. Pre-existing debt (`any`, unused imports, the React
      # Compiler rules) reports as warnings, so this catches new breakage
      # without failing on day-one debt.
      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      # Advisory: `tsc --noEmit` still reports pre-existing type errors that
      # the Vite build tolerates (esbuild does not typecheck). Flip
      # continue-on-error to false once those are cleared.
      - name: Typecheck [advisory]
        working-directory: frontend
        continue-on-error: true
        run: npm run typecheck

      - name: Build Application
        working-directory: frontend
        run: npm run build

      - name: Report Bundle Size
        working-directory: frontend
        run: |
          echo "📊 Bundle Size Report:"
          ls -lh dist/assets/*.js
          du -sh dist/