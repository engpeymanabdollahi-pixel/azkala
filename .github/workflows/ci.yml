name: CI Pipeline

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests (274 tests)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo, sqlite, zip, bcmath
          coverage: none

      - name: Verify composer.json exists
        working-directory: backend
        run: |
          echo "📁 Current directory: C:\laragon\www\azkala"
          echo "📋 Files in backend:"
          ls -la
          if [ ! -f composer.json ]; then
            echo "❌ composer.json not found!"
            exit 1
          fi
          echo "✅ composer.json found"

      - name: Install Dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Environment
        working-directory: backend
        run: |
          cp .env.example .env || echo "APP_NAME=Azkala" > .env
          php artisan key:generate --force || true

      - name: Run PHPUnit Tests
        working-directory: backend
        run: php vendor/bin/phpunit --testdox

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify package files exist
        working-directory: frontend
        run: |
          echo "📁 Current directory: C:\laragon\www\azkala"
          echo "📋 Files in frontend:"
          ls -la
          if [ ! -f package.json ]; then
            echo "❌ package.json not found!"
            exit 1
          fi
          echo "✅ package.json found"

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Application
        working-directory: frontend
        run: npm run build

      - name: Report Bundle Size
        working-directory: frontend
        run: |
          echo "📊 Bundle Size Report:"
          ls -lh dist/assets/*.js
          du -sh dist/